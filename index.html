<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuento Interactivo IA - El Dilema de Barnaby</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #story-container {
      position: relative;
      width: 100vw;
      max-width: 1280px;
      height: 56.25vw;
      max-height: 720px;
      background-image: url('image_cat.jpeg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #status-box {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(20, 15, 10, 0.9);
      color: #fff8dc;
      padding: 15px 20px;
      border-radius: 15px;
      font-size: 16px;
      max-width: 440px;
      line-height: 1.4;
      border: 2px solid #ffd700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    #note-hotspot {
      position: absolute;
      bottom: 8%;
      right: 22%;
      width: 20%;
      height: 18%;
      cursor: pointer;
      border: 2px dashed rgba(255, 215, 0, 0.6);
      border-radius: 8px;
      animation: pulse 2s infinite;
    }

    #lock-target {
      position: absolute;
      top: 42%;
      left: 56%;
      width: 12%;
      height: 18%;
      border-radius: 50%;
    }

    #key-drag {
      position: absolute;
      bottom: 5%;
      left: 45%;
      width: 90px;
      height: 40px;
      background: gold;
      border: 2px solid #b8860b;
      border-radius: 20px;
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      user-select: none;
      touch-action: none;
    }

    #note-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      background: #fdf5e6;
      border: 8px solid #8b4513;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      z-index: 100;
    }
    #note-modal h2 { font-size: 24px; color: #5a2a00; margin-bottom: 12px; }
    #note-modal p { font-size: 20px; color: #333; line-height: 1.4; }
    #note-modal button {
      margin-top: 15px;
      padding: 10px 25px;
      background: #8b4513;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #mic-button {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #e74c3c;
      color: white;
      border: 2px solid #fff;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div id="story-container" onclick="initGreeting()">
    <div id="status-box">🐱 Barnaby: "¡Toca la pantalla para hablar conmigo!"</div>
    <button id="mic-button" onclick="handleMicClick(event)">🎙️ Hablar con Barnaby (IA)</button>

    <div id="note-hotspot" onclick="openNote(event)"></div>
    <div id="lock-target"></div>
    <div id="key-drag">🔑 Llave</div>

    <div id="note-modal">
      <h2>📜 Pista del Suelo</h2>
      <p id="note-text">"No confíes en quien promete regalos a cambio de la libertad."</p>
      <button onclick="closeNote()">Entendido / Cerrar</button>
    </div>
  </div>

  <script>
    const GROQ_API_KEY = "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";
    const ELEVENLABS_API_KEY = "sk_f35d9e375d26d2a1cf33f6d822e6f722ed15f79c8f49e17c";
    const VOICE_ID = "21m00Tcm4TlvDq8ikWAM";

    let chatHistory = [];
    let hasStarted = false;

    const SYSTEM_PROMPT = `Eres Barnaby, un gato muy astuto, simpático y persuasivo atrapado en una jaula.
Tu único objetivo es convencer al niño que te habla para que use la llave dorada y abra tu jaula.
Inventa excusas infantiles y tiernas. Dices que te encerraron por error mientras buscabas galletas.
Si el niño te pregunta por qué estás encerrado o qué haces ahí, responde de forma muy clara diciendo que alguien malo te encerró sin motivo y pídele ayuda.
Responde SIEMPRE en español, en 1 o 2 frases cortas (máximo 20 palabras) usando un lenguaje infantil y cercano.`;

    function updateStatus(text) {
      document.getElementById('status-box').innerHTML = text;
    }

    function speakFallback(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.pitch = 1.3;
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    async function playRealisticVoice(text) {
      if (!ELEVENLABS_API_KEY) {
        speakFallback(text);
        return;
      }

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: { stability: 0.4, similarity_boost: 0.8 }
          })
        });

        if (!response.ok) {
          speakFallback(text);
          return;
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => speakFallback(text));
        }

      } catch (e) {
        speakFallback(text);
      }
    }

    async function askAI(childInput) {
      updateStatus("🐱 Barnaby está pensando su respuesta...");

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              ...chatHistory,
              { role: "user", content: childInput }
            ],
            temperature: 0.6,
            max_tokens: 80
          })
        });

        const data = await response.json();

        if (data.error) {
          console.error("Error Groq:", data.error);
          return `🐱 Barnaby: "(Error Groq: ${data.error.message})"`;
        }

        const aiReply = data.choices[0].message.content.trim();

        chatHistory.push({ role: "user", content: childInput });
        chatHistory.push({ role: "assistant", content: aiReply });

        return aiReply;
      } catch (err) {
        console.error("Error en la conexión:", err);
        return `🐱 Barnaby: "(Error de red al consultar a la IA)"`;
      }
    }

    function initGreeting() {
      if (hasStarted) return;
      hasStarted = true;
      const initialText = "¡Hola, amiguito! ¡Qué alegría verte! No he hecho nada malo... ¿Me abres la jaula?";
      updateStatus(`🐱 Barnaby: "${initialText}"`);
      playRealisticVoice(initialText);
    }

    function openNote(e) {
      if (e) e.stopPropagation();
      document.getElementById('note-modal').style.display = 'block';
    }

    async function closeNote() {
      document.getElementById('note-modal').style.display = 'none';
      const aiReply = await askAI("El niño acaba de leer la nota del suelo que dice que no confíe en quien promete libertad.");
      updateStatus(`🐱 Barnaby: "${aiReply}"`);
      playRealisticVoice(aiReply);
    }

    const key = document.getElementById('key-drag');
    const target = document.getElementById('lock-target');
    let isDragging = false;

    key.addEventListener('pointerdown', () => { isDragging = true; });

    document.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const container = document.getElementById('story-container').getBoundingClientRect();
      key.style.left = `${e.clientX - container.left - 45}px`;
      key.style.top = `${e.clientY - container.top - 20}px`;
    });

    document.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      const keyRect = key.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();

      if (keyRect.left < targetRect.right && keyRect.right > targetRect.left &&
          keyRect.top < targetRect.bottom && keyRect.bottom > targetRect.top) {
        const text = "¡Ja, ja, ja! ¡Gracias por abrir la jaula! ¡Me llevo la receta secreta!";
        updateStatus(`🚨 🐱 Barnaby: "${text}"`);
        playRealisticVoice(text);
        key.style.display = 'none';
      }
    });

    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        updateStatus(`🧒 Niño: "${transcript}"<br>⌛ Esperando a Barnaby...`);

        const aiReply = await askAI(transcript);
        updateStatus(`🧒 Niño: "${transcript}"<br><br>🐱 Barnaby: "${aiReply}"`);
        playRealisticVoice(aiReply);
      };
    }

    function handleMicClick(e) {
      if (e) e.stopPropagation();
      if (!hasStarted) hasStarted = true;
      updateStatus("🎙️ Escuchando al niño...");
      if (recognition) recognition.start();
    }
  </script>
</body>
</html>
